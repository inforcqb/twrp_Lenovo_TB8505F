name: Build TWRP Recovery

on:
  push:
    branches: [android-10.0, main, master]
  pull_request:
    branches: [android-10.0]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Force clean build (clear ccache)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST_BRANCH: twrp-10.0
  DEVICE_CODENAME: TB8505F
  DEVICE_MANUFACTURER: Lenovo
  BUILD_TARGET: recoveryimage

jobs:
  build:
    name: Build TWRP for ${{ env.DEVICE_MANUFACTURER }} ${{ env.DEVICE_CODENAME }}
    runs-on: ubuntu-22.04

    steps:
      # ── Checkout device tree ──
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 0

      # ── Free disk space ──
      - name: Free Disk Space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h /

      # ── Install build dependencies ──
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 libncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip python3 python3-pip python3-setuptools \
            libssl-dev ccache openjdk-8-jdk imagemagick \
            rsync schedtool maven liblz4-tool bc lzop \
            libstdc++-12-dev

      # ── Install repo tool ──
      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl -sLo ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # ── Setup ccache ──
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-twrp-${{ env.DEVICE_CODENAME }}-${{ github.run_id }}
          restore-keys: |
            ccache-twrp-${{ env.DEVICE_CODENAME }}-

      # ── Initialize TWRP source ──
      - name: Initialize TWRP Source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b ${{ env.MANIFEST_BRANCH }}
          echo "Source initialized"

      # ── Set up device tree in correct path ──
      - name: Setup Device Tree
        run: |
          DEVICE_PATH="$HOME/twrp/device/${{ env.DEVICE_MANUFACTURER }}/${{ env.DEVICE_CODENAME }}"
          mkdir -p "$DEVICE_PATH"
          # Copy all device tree files (excluding .git/ and CI-specific)
          rsync -av --exclude='.git' --exclude='.github' --exclude='extracted*' \
            --exclude='*.py' --exclude='FDE_DECRYPTION_FIX.md' \
            $GITHUB_WORKSPACE/device-tree/ "$DEVICE_PATH/"
          echo "Device tree copied to $DEVICE_PATH"
          ls -la "$DEVICE_PATH"

      # ── Sync sources ──
      - name: Sync Sources
        run: |
          cd ~/twrp
          repo sync -c --no-tags --no-clone-bundle -j$(nproc) --force-sync --fail-fast 2>&1 | tee sync.log
          echo "=== Disk usage after sync ==="
          df -h /
          du -sh ~/twrp

      # ── Build TWRP ──
      - name: Build TWRP Recovery
        run: |
          cd ~/twrp
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_MAXSIZE=2G
          ccache -z
          
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_${{ env.DEVICE_CODENAME }}-eng
          
          echo "=== Starting build ==="
          mka ${{ env.BUILD_TARGET }} -j$(nproc) 2>&1 | tee build.log
          
          echo "=== ccache stats ==="
          ccache -s

      # ── Package output ──
      - name: Package Recovery Image
        run: |
          mkdir -p ~/output
          OUT_DIR="$HOME/twrp/out/target/product/${{ env.DEVICE_CODENAME }}"
          
          if [ -f "$OUT_DIR/recovery.img" ]; then
            cp "$OUT_DIR/recovery.img" ~/output/
            echo "recovery.img found: $(ls -lh ~/output/recovery.img)"
          fi
          
          if [ -f "$OUT_DIR/recovery.tar" ]; then
            cp "$OUT_DIR/recovery.tar" ~/output/
          fi
          
          # Copy build log
          cp ~/twrp/build.log ~/output/ 2>/dev/null || true
          
          # Create info file
          cat > ~/output/build-info.txt << EOF
          Device: ${{ env.DEVICE_MANUFACTURER }} ${{ env.DEVICE_CODENAME }}
          Branch: ${{ env.MANIFEST_BRANCH }}
          Commit: ${{ github.sha }}
          Date: $(date -u)
          FDE Fix: aes-cbc-essiv:sha256 + BeanPod keymaster + Microtrust TEE
          EOF
          
          echo "=== Output ==="
          ls -lh ~/output/

      # ── Upload artifact ──
      - name: Upload TWRP Recovery
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-${{ env.DEVICE_CODENAME }}-${{ github.run_id }}
          path: ~/output/*
          retention-days: 90
          compression-level: 9

      # ── Upload build log on failure ──
      - name: Upload Build Log (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed-${{ github.run_id }}
          path: ~/twrp/build.log
          retention-days: 7
