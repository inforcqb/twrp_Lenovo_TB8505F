name: Build TWRP Recovery

on:
  push:
    branches: [android-10.0]
  pull_request:
    branches: [android-10.0]
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP for Lenovo TB8505F
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Free Disk Space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 libncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip python3 ccache openjdk-8-jdk \
            rsync schedtool bc lzop libstdc++-12-dev

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl -sLo ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-twrp-TB8505F-v2-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            ccache-twrp-TB8505F-v2-

      - name: Initialize TWRP Source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0-deprecated

      - name: Setup Device Tree
        run: |
          DEVICE_PATH="$HOME/twrp/device/Lenovo/TB8505F"
          mkdir -p "$DEVICE_PATH"
          rsync -av --exclude='.git' --exclude='.github' --exclude='extracted*' \
            --exclude='*.py' --exclude='*.md' \
            $GITHUB_WORKSPACE/device-tree/ "$DEVICE_PATH/"
          echo "Device tree copied to $DEVICE_PATH"
          ls -la "$DEVICE_PATH"

      - name: Sync Sources
        timeout-minutes: 60
        run: |
          cd ~/twrp
          repo sync -c --no-tags --no-clone-bundle -j$(nproc) --force-sync --fail-fast || \
            repo sync -c --no-tags --no-clone-bundle -j4 --force-sync
          echo "=== Disk usage ==="
          df -h /
          du -sh ~/twrp

      - name: Remove vdc_pie Prebuilt (Fix TW_CRYPTO_USE_SYSTEM_VOLD Conflict)
        run: |
          cd ~/twrp
          # twrp-10.0-deprecated manifest includes prebuilt vdc_pie
          # which conflicts with source-built vdc when TW_CRYPTO_USE_SYSTEM_VOLD is enabled.
          # Step 1: Disable vdc_pie in prebuilt/Android.mk by renaming the module.
          # Using module rename (not line commenting) preserves the module structure
          # so LOCAL_SRC_FILES is still valid (avoids "No source files" error).
          if [ -f bootable/recovery/prebuilt/Android.mk ]; then
            sed -i 's/LOCAL_MODULE := vdc_pie/LOCAL_MODULE := vdc_pie_disabled/g' bootable/recovery/prebuilt/Android.mk
            echo "Disabled vdc_pie in prebuilt/Android.mk via module rename"
          fi
          # Step 2: Strip vdc_pie cc_binary from bootable/recovery/Android.bp (Soong-based)
          if [ -f bootable/recovery/Android.bp ]; then
            perl -i -0777 -pe 's/cc_binary\s*\{[^}]*name:\s*"vdc_pie"[^}]*\}//gs' bootable/recovery/Android.bp
            echo "Stripped vdc_pie from bootable/recovery/Android.bp"
          fi

      - name: Add missing tw_atomic.hpp (Fix twrp-10.0-deprecated compatibility)
        run: |
          cd ~/twrp/bootable/recovery
          # twrp-10.0-deprecated manifest is missing tw_atomic.hpp
          # which is required by partitions.hpp when TW_CRYPTO_USE_SYSTEM_VOLD is enabled.
          # Create the minimal header with inline implementations.
          cat > tw_atomic.hpp << 'HEADEREOF'
          /*
           * Copyright (C) 2015 The Team Win Recovery Project
           *
           * Licensed under the Apache License, Version 2.0 (the "License");
           * you may not use this file except in compliance with the License.
           * You may obtain a copy of the License at
           *
           *      http://www.apache.org/licenses/LICENSE-2.0
           *
           * Unless required by applicable law or agreed to in writing, software
           * distributed under the License is distributed on an "AS IS" BASIS,
           * WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
           * See the License for the specific language governing permissions and
           * limitations under the License.
           */

          #ifndef _TWATOMIC_HPP_HEADER
          #define _TWATOMIC_HPP_HEADER

          #include <pthread.h>

          class TWAtomicInt
          {
          public:
              TWAtomicInt(int initial_value = 0) : value(initial_value), use_mutex(false) {
                  pthread_mutex_init(&mutex_lock, NULL);
              }
              ~TWAtomicInt() {
                  pthread_mutex_destroy(&mutex_lock);
              }
              void set_value(int new_value) {
                  if (use_mutex) pthread_mutex_lock(&mutex_lock);
                  value = new_value;
                  if (use_mutex) pthread_mutex_unlock(&mutex_lock);
              }
              int get_value() {
                  int ret;
                  if (use_mutex) pthread_mutex_lock(&mutex_lock);
                  ret = value;
                  if (use_mutex) pthread_mutex_unlock(&mutex_lock);
                  return ret;
              }

          private:
              int value;
              bool use_mutex;
              pthread_mutex_t mutex_lock;
          };

          #endif //_TWATOMIC_HPP_HEADER
          HEADEREOF
          echo "Created tw_atomic.hpp for twrp-10.0-deprecated compatibility"

      - name: Fix missing system headers (Add include paths for twrp-10.0-deprecated)
        run: |
          cd ~/twrp
          # twrpApex.hpp (included via partitions.hpp when TW_CRYPTO_USE_SYSTEM_VOLD is set)
          # requires <ziparchive/zip_archive.h> and transitive <android-base/*.h> but
          # twrp-10.0-deprecated doesn't add these include paths to libvolddecrypt.
          # Copy headers into system/core/include (already in standard include path).
          #
          # 1) libziparchive headers
          if [ -d system/core/libziparchive/include/ziparchive ]; then
            mkdir -p system/core/include/ziparchive
            cp system/core/libziparchive/include/ziparchive/*.h system/core/include/ziparchive/
            echo "Copied ziparchive headers"
          else
            echo "ERROR: ziparchive headers not found"
            exit 1
          fi
          # 2) libbase headers (transitive dep of zip_archive.h: android-base/off64_t.h etc.)
          if [ -d system/core/base/include/android-base ]; then
            mkdir -p system/core/include/android-base
            cp system/core/base/include/android-base/*.h system/core/include/android-base/
            echo "Copied android-base headers"
          else
            echo "ERROR: android-base headers not found"
            exit 1
          fi
          echo "Header fixup complete"
          ls -la system/core/include/ziparchive/
          ls -la system/core/include/android-base/

      - name: Fix LOGINFO macro redefinition (undef before vold_decrypt.cpp redefine)
        run: |
          cd ~/twrp
          # vold_decrypt.cpp and twcommon.h both define LOGINFO.
          # When twrpApex.hpp pulls in additional system headers via ziparchive,
          # this previously-hidden conflict becomes visible as -Werror.
          # Fix: add #undef before the LOGINFO redefinition in vold_decrypt.cpp.
          sed -i '/^#define LOGINFO/i #undef LOGINFO' bootable/recovery/crypto/vold_decrypt/vold_decrypt.cpp
          echo "Added #undef LOGINFO before redefinition in vold_decrypt.cpp"

      - name: Build TWRP Recovery
        timeout-minutes: 120
        run: |
          cd ~/twrp
          export USE_CCACHE=1
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE=2G
          ccache -z
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_TB8505F-eng
          set -o pipefail
          mka recoveryimage -j$(nproc) 2>&1 | tee build.log
          ccache -s

      - name: Package Recovery Image
        if: success()
        run: |
          mkdir -p ~/output
          OUT_DIR="$HOME/twrp/out/target/product/TB8505F"
          if [ -f "$OUT_DIR/recovery.img" ]; then
            cp "$OUT_DIR/recovery.img" ~/output/
            echo "recovery.img: $(ls -lh ~/output/recovery.img)"
          fi
          cp ~/twrp/build.log ~/output/ 2>/dev/null || true
          echo "Device: Lenovo TB-8505F (MT6761)" > ~/output/build-info.txt
          echo "FDE: aes-cbc-essiv:sha256 + PureSW keymaster" >> ~/output/build-info.txt
          echo "Crypto: TW_CRYPTO_USE_SYSTEM_VOLD enabled" >> ~/output/build-info.txt
          echo "Manifest: twrp-10.0-deprecated" >> ~/output/build-info.txt
          ls -lh ~/output/

      - name: Upload TWRP Recovery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TB8505F-${{ github.run_id }}
          path: ~/output/*
          retention-days: 90
          compression-level: 9

      - name: Upload Build Log (failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed-${{ github.run_id }}
          path: ~/twrp/build.log
          retention-days: 7